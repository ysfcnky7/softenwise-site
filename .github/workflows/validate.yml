# SoftenWise — GitHub mirror of bitbucket-pipelines.yml
# Does not deploy. node_modules must never be tracked.
name: Validate

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: node_modules must not be tracked
        run: |
          tracked="$(git ls-files 'node_modules' '**/node_modules/**')"
          if [ -n "$tracked" ]; then
            echo "Tracked node_modules paths:"
            echo "$tracked"
            exit 1
          fi
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: ".nvmrc"
          cache: npm
      - run: npm ci
      - run: npm run validate
