image: node:20

pipelines:
  default:
    - step:
        name: Validate static site
        caches:
          - node
        script:
          - |
            tracked="$(git ls-files 'node_modules' '**/node_modules/**')"
            if [ -n "$tracked" ]; then
              echo "Tracked node_modules paths:"
              echo "$tracked"
              exit 1
            fi
          - npm ci
          - npm run validate
